name: CI

on:
  workflow_call:
    inputs:
      test-command:
        description: 'Test command(s) which should be used to test a package'
        default: 'nimble test'
        required: false
        type: string
      install-command:
        description: 'A (Nimble) command which should be used for installing a package'
        default: 'nimble --useSystemNim install -y --depsOnly'
        required: false
        type: string
      targets:
        description: 'List of targets which should be used for testing, each optionally mapped to the runner label(s) to use'
        default: '["linux-amd64", "linux-arm64", "linux-i386", "macos-arm64", "windows-amd64"]'
        required: false
        type: string
      nim-versions:
        description: 'List of Nim versions which should be used for testing'
        default: '["", "version-*", "devel"]'
        required: false
        type: string
      nimble-version:
        description: 'NIMBLE_COMMIT to use when compiling nimble, defaults to the one shipped with nim'
        default: 'a399f502dec7ffcd905c1cf54b13274ad990bada' # v0.24.1
        required: false
        type: string
      nimble-bin-path:
        description: 'Add .nimble/bin path to GITHUB_PATH'
        required: false
        default: false
        type: boolean
      concurrency-suffix:
        description: 'Suffix for the concurrency group, needed when calling this workflow multiple times from the same workflow'
        default: ''
        required: false
        type: string

    secrets:
      EXTERNAL_SERVICE_TOKEN:
        required: false
        description: "Optional auth token for external services, e.g. Bencher, Codecov, etc."

concurrency: # Cancel stale PR builds (but not push builds)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}${{ inputs.concurrency-suffix && format('-{0}', inputs.concurrency-suffix) }}
  cancel-in-progress: true

jobs:
  nim-versions:
    name: Nim versions
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      nim-versions: ${{ steps.nim-versions.outputs.nim-versions }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Expand targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          targets=$(jq -c '
            {
              # We need GCC >= 14 and Clang >= 20. Replace this with "ubuntu-latest" once it is 26.04 (19 Nov 2026)
              "linux-amd64": {os: "linux", cpu: "amd64", platform: "x64", builder: "ubuntu-26.04"},
              "linux-arm64": {os: "linux", cpu: "arm64", platform: "arm64", builder: "ubuntu-26.04-arm"},
              "linux-i386": {os: "linux", cpu: "i386", platform: "x86", builder: "ubuntu-latest"},
              "macos-arm64": {os: "macos", cpu: "arm64", platform: "arm64", builder: "macos-latest"},
              "windows-amd64": {os: "windows", cpu: "amd64", platform: "x64", builder: "windows-latest"}
            } as $known
            | map(if type == "string" then {(.): null} else . end | to_entries[])
            | if length == 0 then error("No targets") else . end
            | if (map(.key) | unique | length) != length then error("Duplicate targets") else . end
            | map(($known[.key] // error("Unknown target: \(.key)")) + if .value then {builder: .value} else {} end)' <<< "$TARGETS")
          echo "Targets: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine minimum Nim version
        id: min-nim
        if: contains(fromJson(inputs.nim-versions), '') || contains(fromJson(inputs.nim-versions), 'version-*')
        timeout-minutes: 10
        run: |
          if compgen -G '*.nimble' > /dev/null; then
            stable=$(curl -fsSL https://nim-lang.org/channels/stable)
            curl -fsSL "https://nim-lang.org/download/nim-${stable}-linux_x64.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/nim-${stable}/bin/nimble" --resolver:minver --lockFile:minver.lock -y lock
            version=$(jq -r '.packages.nim.version // empty' minver.lock)
            version=${version:-$stable}
          else
            version=1.6.16  # Lowest version that can be built with build_nim.sh
          fi
          echo "Minimum Nim version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine Nim release branches
        id: branches
        if: contains(fromJson(inputs.nim-versions), 'version-*')
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_NIM: ${{ steps.min-nim.outputs.version }}
        run: |
          branches=$(gh api repos/nim-lang/Nim/git/matching-refs/heads/version- | jq -c --arg min "$MIN_NIM" '
            def ver: [scan("[0-9]+") | tonumber];
            [.[].ref | ltrimstr("refs/heads/") | select(test("^version-[0-9]+-[0-9]+$"))]
            | map(select(ver >= ($min | ver)[:2])) | sort_by(ver)')
          echo "Nim release branches: $branches"
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

      - name: Expand Nim versions
        id: nim-versions
        env:
          NIM_VERSIONS: ${{ inputs.nim-versions }}
          MIN_NIM: ${{ steps.min-nim.outputs.version }}
          BRANCHES: ${{ steps.branches.outputs.branches || '[]' }}
        run: |
          nim_versions=$(jq -c --arg min "v$MIN_NIM" --argjson branches "$BRANCHES" \
            'map(if . == "" then $min elif . == "version-*" then $branches[] else . end)' <<< "$NIM_VERSIONS")
          echo "Nim versions: $nim_versions"
          echo "nim-versions=$nim_versions" >> "$GITHUB_OUTPUT"

  build:
    needs: nim-versions
    env:
      NIMBLE_COMMIT: ${{ inputs.nimble-version }}
      LLVM_MINGW_VERSION: '20250709'  # LLVM 20.1.8
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.nim-versions.outputs.targets) }}
        branch: ${{ fromJson(needs.nim-versions.outputs.nim-versions) }}
    defaults:
      run:
        shell: bash

    name: '${{ matrix.target.os }}-${{ matrix.target.cpu }} (Nim ${{ matrix.branch }})'
    runs-on: ${{ matrix.target.builder }}
    continue-on-error: ${{ matrix.branch == 'devel' }}


    steps:
      # Temporary dir for self-hosted runners, as Nim caches builds in this
      - name: Use per-job cache directory
        run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build dependencies (Linux i386)
        if: runner.os == 'Linux' && matrix.target.cpu == 'i386'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq gcc-multilib g++-multilib libssl-dev:i386
          mkdir -p external/bin
          cat << EOF > external/bin/gcc
          #!/bin/bash
          exec $(which gcc) -m32 -mno-adx "\$@"
          EOF
          cat << EOF > external/bin/g++
          #!/bin/bash
          exec $(which g++) -m32 -mno-adx "\$@"
          EOF
          chmod 755 external/bin/gcc external/bin/g++
          echo '${{ github.workspace }}/external/bin' >> $GITHUB_PATH



      - name: Restore llvm-mingw (Windows) from cache
        if: runner.os == 'Windows'
        id: windows-mingw-cache
        uses: actions/cache@v6
        with:
          path: external/mingw-${{ matrix.target.cpu }}
          key: 'llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-${{ matrix.target.cpu }}'

      - name: Install llvm-mingw dependency (Windows)
        if: >
          steps.windows-mingw-cache.outputs.cache-hit != 'true' &&
          runner.os == 'Windows'
        run: |
          mkdir -p external
          MINGW_BASE="https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION"
          if [[ '${{ matrix.target.cpu }}' == 'amd64' ]]; then
            MINGW_URL="$MINGW_BASE/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-x86_64.zip"
          else
            MINGW_URL="$MINGW_BASE/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-i686.zip"
          fi
          curl -L "$MINGW_URL" -o "external/mingw-${{ matrix.target.cpu }}.zip"
          7z x -y "external/mingw-${{ matrix.target.cpu }}.zip" -oexternal/mingw-${{ matrix.target.cpu }}/
          mv external/mingw-${{ matrix.target.cpu }}/**/* ./external/mingw-${{ matrix.target.cpu }}

      - name: Restore Nim DLLs dependencies (Windows) from cache
        if: runner.os == 'Windows'
        id: windows-dlls-cache
        uses: actions/cache@v6
        with:
          path: external/dlls-${{ matrix.target.cpu }}
          key: 'dlls-${{ matrix.target.cpu }}'

      - name: Install DLLs dependencies (Windows)
        if: >
          runner.os == 'Windows' &&
          steps.windows-dlls-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p external
          curl -L "https://nim-lang.org/download/windeps.zip" -o external/windeps.zip
          7z x -y external/windeps.zip -oexternal/dlls-${{ matrix.target.cpu }}

      - name: Path to cached dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "${{ github.workspace }}/external/mingw-${{ matrix.target.cpu }}/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/external/dlls-${{ matrix.target.cpu }}" >> $GITHUB_PATH



      - name: Get Nim commit hash
        id: nim-hash
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ matrix.branch }}
        with:
          script: |
            const branch = process.env.BRANCH;
            let sha;
            if (branch.startsWith("./")) {
              // Commit pinned by the (possibly nested) submodule at that path
              const path = require("path");
              const res = await exec.getExecOutput("git", [
                "-C", path.dirname(branch),
                "rev-parse", `HEAD:./${path.basename(branch)}`,
              ]);
              sha = res.stdout.trim();
            } else {
              const res = await github.rest.repos.getCommit({
                owner: "nim-lang",
                repo: "Nim",
                ref: branch,
              });
              sha = res.data.sha;
            }
            core.setOutput("nim_commit_hash", sha);
            core.exportVariable("NIM_COMMIT_HASH", sha);

      - name: Restore Nim build from cache
        id: nim-cache
        uses: actions/cache/restore@v6
        with:
          path: &nim-cache-paths |
            nim/bin
            nim/config
            nim/doc
            nim/lib
            nim/nim.nimble
            nim/tools
          key: nim-v3-${{ matrix.branch }}-${{ steps.nim-hash.outputs.nim_commit_hash }}-${{ matrix.target.os }}-${{ matrix.target.cpu }}-${{ join(matrix.target.builder, '-') }}-${{ inputs.nimble-version }}

      - name: Build Nim and Nimble
        if: steps.nim-cache.outputs.cache-hit != 'true'
        env:
          MAKE: make -j4
          ARCH_OVERRIDE: ${{ matrix.target.platform }}
          NIM_COMMIT: ${{ steps.nim-hash.outputs.nim_commit_hash }}
          QUICK_AND_DIRTY_COMPILER: 1
          QUICK_AND_DIRTY_NIMBLE: 1
          CC: gcc
        run: |
          curl -O -L -s -S https://raw.githubusercontent.com/status-im/nimbus-build-system/master/scripts/build_nim.sh
          bash build_nim.sh nim csources dist/nimble NimBinaries

      - name: Save Nim build to cache
        if: steps.nim-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *nim-cache-paths
          key: ${{ steps.nim-cache.outputs.cache-primary-key }}

      - name: Add Nim bin to GITHUB_PATH
        run: echo '${{ github.workspace }}/nim/bin' >> $GITHUB_PATH

      - name: Add .nimble/bin path to GITHUB_PATH
        if: ${{ inputs.nimble-bin-path }}
        run: |
          if [[ '${{ runner.os }}' == 'Linux' ]]; then
            echo '/home/runner/.nimble/bin' >> $GITHUB_PATH
          elif [[ '${{ runner.os }}' == 'Windows' ]]; then
            echo 'C:/Users/runneradmin/.nimble/bin' >> $GITHUB_PATH
          else
            echo '~/.nimble/bin' >> $GITHUB_PATH
          fi



      - name: Run tests
        env:
          PLATFORM: ${{ matrix.target.platform }}
          MATRIX_OS: ${{ matrix.target.os }}
          CPU: ${{ matrix.target.cpu }}
          NIM_VERSION: ${{ matrix.branch }}
          EXTERNAL_SERVICE_TOKEN: ${{ secrets.EXTERNAL_SERVICE_TOKEN }}
        run: |
          nim --version
          nimble --version
          gcc --version
          clang --version
          ${{ inputs.install-command }}
          ${{ inputs.test-command }}

  summary:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        run: |
          [[ '${{ needs.build.result }}' == 'success' ]]
